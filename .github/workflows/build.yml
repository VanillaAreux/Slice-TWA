name: Build and publish Slice Android release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download the original Slice signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-keys
          repository: ${{ github.repository }}
          run-id: 39153658606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: signing-keys

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Align and sign with the original key
        run: |
          set -euo pipefail
          PASS="$(cat signing-keys/keystore-password.txt)"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p out
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks signing-keys/release.keystore --ks-key-alias slice --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out out/slice-release.apk aligned.apk
          "$BT/apksigner" verify --verbose out/slice-release.apk
          unset PASS

      - name: Publish latest GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V1.2.0
          name: Slice Android 1.2.0
          target_commitish: main
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Slice Android 1.2.0

            - Updated the app to use https://slicesocial.netlify.app/
            - Updated internal navigation, downloads, and Android App Links.
          files: out/slice-release.apk
