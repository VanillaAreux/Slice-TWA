name: Build Slice Android release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing key
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            PASS="$KS_PASS"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore release.keystore -alias slice \\
              -keyalg RSA -keysize 2048 -validity 10000 \\
              -storepass "$PASS" -keypass "$PASS" \\
              -dname "CN=Slice, O=Slice Technologies, C=US"
            cp release.keystore out/release.keystore
            echo "$PASS" > out/keystore-password.txt
          fi
          echo "::add-mask::$PASS"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          FP=$(keytool -list -v -keystore release.keystore -alias slice -storepass "$PASS" | grep 'SHA256:' | sed 's/.*SHA256: //')
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "com.slicetechnologies.slice",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FP" > out/assetlinks.json
          echo "SHA256: $FP" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Align and sign
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias slice \\
            --ks-pass "pass:${{ steps.key.outputs.pass }}" --out out/Slice.apk aligned.apk
          "$BT/apksigner" verify out/Slice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Slice-apk
          path: out/Slice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: out/assetlinks.json

      - uses: actions/upload-artifact@v4
        if: hashFiles('out/keystore-password.txt') != ''
        with:
          name: signing-keys
          path: |
            out/release.keystore
            out/keystore-password.txt
